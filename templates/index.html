<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ML Predictor</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #111827;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            outline: none;
            background: #1f2937;
            color: white;
        }

        input::placeholder {
            color: #9ca3af;
        }

        button {
            width: 95%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #16a34a;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            color: #38bdf8;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h2>🔍 ML Predictor</h2>

            <form action="/predict" method="post">
                <input type="number" step="any" name="feature1" placeholder="Feature 1" required>
                <input type="number" step="any" name="feature2" placeholder="Feature 2" required>
                <input type="number" step="any" name="feature3" placeholder="Feature 3" required>

                <button type="submit">Predict</button>
            </form>

            {% if prediction_text %}
                <div class="result">{{ prediction_text }}</div>
            {% endif %}
        </div>
    </div>
</body>
</html>
